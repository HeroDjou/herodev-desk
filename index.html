<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeroDev - Central de serviços</title>
    <link href="node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="node_modules/@fortawesome/fontawesome-free/css/all.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div id="splashScreen" class="splash-screen">
        <div class="splash-logo">HeroDev</div>
        <div class="splash-spinner"></div>
        <p class="text-muted mt-3">Carregando serviços...</p>
    </div>

    <nav id="tabBar" class="tab-bar d-none">
        <ul class="nav nav-tabs" id="tabNav" role="tablist"></ul>
    </nav>

    <div class="container-fluid px-5" id="mainContent">
        <div id="cardsContainer">
            <h1 class="text-center mb-4 h3">Central de serviços HeroDev</h1>
            
            <!-- Cards gerados em runtime a partir de config.services (app.js):
                 a URL de cada servico depende do no ativo (local x Raspberry),
                 entao duplicar isso em HTML estatico deixaria os dois fora de
                 sincronia na primeira troca de no. -->
            <div class="row row-cols-2 row-cols-md-3 row-cols-lg-6 g-3" id="serviceCards">
                <div class="col-12 text-center text-muted small">Carregando serviços...</div>
            </div>

            <h2 class="h5 text-center mt-5 mb-3">Stack instalado</h2>
            <div id="stackContainer" class="d-flex flex-column align-items-center gap-3 pb-4">
                <span class="text-muted small">Carregando stack...</span>
            </div>
        </div>
    </div>

    <footer id="statusBar" class="status-bar">
        <div class="container-fluid px-3">
            <div class="d-flex justify-content-between align-items-center">
                <div id="servicesStatus" class="d-flex align-items-center gap-1 flex-wrap">
                    <span class="text-muted small">Carregando...</span>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span id="nodeIndicator" class="text-muted small"></span>
                    <span class="text-muted small">HeroDev v1.1.0</span>
                </div>
            </div>
        </div>
    </footer>

    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
